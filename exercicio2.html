
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotação dos números</title>
    <style>
        
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 80px;
    background-color: #f0f0f0;
}

input {
    padding: 12px;
    width: 250px;
    font-size: 20px;
}

#resultado {
    margin-top: 30px;
    font-size: 35px;
}

.digito {
    display: inline-block;
}

.rotacionar {
    animation: girar 1s linear;
}

@keyframes girar {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

    </style>
</head>
<body>

    <h1>Rotação dos números</h1>

    <input 
        type="text" 
        id="numeros" 
        placeholder="Digite alguns números"
    >

    <div id="resultado"></div>

    <script src="exercicio2.js"></script>
</body>
</html>
